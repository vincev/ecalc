[package]
authors = ["Vince Vasta <vince.vasta@gmail.com>"]
categories = ["command-line-utilities", "mathematics"]
description = "Terminal RPN calculator"
edition = "2024"
rust-version = "1.89"
keywords = ["calculator", "rpn", "terminal", "tui"]
license = "Apache-2.0"
name = "ecalc"
repository = "https://github.com/vincev/ecalc.git"
version = "0.2.17"

[[bin]]
name = "ec"
path = "src/main.rs"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
num-bigint = "0.4.8"
num-integer = "0.1.47"
num-rational = "0.4.2"
num-traits = "0.2.19"
ratatui = "0.30.2"

name: ci

on:
  push:
  pull_request:

# The jobs only read the code, so the token gets nothing else.
permissions:
  contents: read

jobs:
  check:
    name: fmt and clippy
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test ${{ matrix.toolchain }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # 1.89 is `rust-version` in Cargo.toml. Change both together.
        toolchain: [stable, "1.89"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test
